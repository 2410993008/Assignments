<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Student Feedback Form</h2>

    <form id="feedbackForm">

      <label for="name">Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name">
      <p class="error" id="nameError"></p>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email">
      <p class="error" id="emailError"></p>

      <label for="course">Course</label>
      <select id="course" name="course">
        <option value="">Select Course</option>
        <option value="Web Development">Web Development</option>
        <option value="Data Science">Data Science</option>
        <option value="Computer Science">Computer Science</option>
      </select>
      <p class="error" id="courseError"></p>

      <label for="feedback">Feedback</label>
      <textarea id="feedback" name="feedback" rows="4" placeholder="Write your feedback"></textarea>
      <p class="error" id="feedbackError"></p>

      <button type="button" onclick="submitForm()">Submit Feedback</button>
      <button type="button" onclick="deleteData()">Delete Stored Data</button>

    </form>

    <p id="sessionUser"></p>

    <h3>Stored Feedback</h3>
    <div id="storedData">No feedback stored.</div>

  </div>

  <script src="script.js"></script>
</body>
</html>
